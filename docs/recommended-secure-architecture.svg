<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" style="max-width:100%;height:auto" role="img" aria-labelledby="secure-title secure-desc">
<title id="secure-title">Recommended secure Foundry agent architecture</title>
<desc id="secure-desc">Recommended architecture separates user ingress, agent and user tool identities, Search and knowledge base trust boundaries, model gateways, and content-minimized telemetry.</desc>
<rect width="1900" height="1320" fill="white"/>
<defs><marker id="secure-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#495057"/></marker></defs>
<text x="40" y="52" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="32" fill="#000000">
<tspan x="40" dy="0">Recommended secure Foundry agent architecture</tspan>
</text>
<text x="40" y="96" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Identity findings are live-verified; private networking is the recommended target and was not fully exercised by this lab.</tspan>
</text>
<rect x="40" y="125" width="1820" height="82" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="950.0" y="153.85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#000000">
<tspan x="950.0" dy="0">Enforcement = identity + downstream RBAC + isolated Search / KB / gateway boundaries.</tspan>
<tspan x="950.0" dy="24.3">Toolbox, APIM and telemetry improve authentication and visibility; they do not create per-index RBAC.</tspan>
</text>
<rect x="30" y="235" width="1120" height="500" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/>
<text x="50" y="271" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#000000">
<tspan x="50" dy="0">1. Tool and data authorization plane</tspan>
</text>
<rect x="70" y="325" width="180" height="110" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="160.0" y="369.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="160.0" dy="0">User / app</tspan>
<tspan x="160.0" dy="21.6">Entra ID</tspan>
</text>
<rect x="300" y="315" width="220" height="130" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="410.0" y="347.6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="410.0" dy="0">APIM ingress</tspan>
<tspan x="410.0" dy="21.6">validate JWT</tspan>
<tspan x="410.0" dy="21.6">rate limit</tspan>
<tspan x="410.0" dy="21.6">correlation ID</tspan>
</text>
<rect x="570" y="315" width="220" height="130" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="680.0" y="358.4" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="680.0" dy="0">Foundry agent</tspan>
<tspan x="680.0" dy="21.6">explicit orchestration</tspan>
<tspan x="680.0" dy="21.6">(no automatic A2A)</tspan>
</text>
<rect x="840" y="315" width="250" height="130" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text x="965.0" y="358.4" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="965.0" dy="0">Toolbox</tspan>
<tspan x="965.0" dy="21.6">select per-tool auth</tspan>
<tspan x="965.0" dy="21.6">project / agent / user</tspan>
</text>
<path d="M250,380 L300,380" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="275.0" y="364.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="275.0" dy="0">user JWT</tspan>
</text>
<path d="M520,380 L570,380" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="545.0" y="364.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="545.0" dy="0">user + correlation</tspan>
</text>
<path d="M790,380 L840,380" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="815.0" y="364.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="815.0" dy="0">tool call</tspan>
</text>
<text x="300" y="487" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#000000">
<tspan x="300" dy="0">Choose one connection identity per tool:</tspan>
</text>
<rect x="300" y="515" width="230" height="145" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="415.0" y="565.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="415.0" dy="0">Project MI</tspan>
<tspan x="415.0" dy="21.6">shared project access</tspan>
<tspan x="415.0" dy="21.6">Verified: IQ A</tspan>
</text>
<rect x="570" y="515" width="230" height="145" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text x="685.0" y="565.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="685.0" dy="0">Agent identity</tspan>
<tspan x="685.0" dy="21.6">per-agent least privilege</tspan>
<tspan x="685.0" dy="21.6">Verified: B / deny C</tspan>
</text>
<rect x="840" y="515" width="250" height="145" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="965.0" y="565.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="965.0" dy="0">User token / OBO</tspan>
<tspan x="965.0" dy="21.6">Verified: trusted IQ</tspan>
<tspan x="965.0" dy="21.6">OAuth + APIM fallback</tspan>
</text>
<text x="70" y="696" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="70" dy="0">Same project != automatic agent-to-agent permission. Configure agent references and supported orchestration explicitly.</tspan>
</text>
<rect x="1180" y="235" width="690" height="500" rx="14" fill="none" stroke="#D13438" stroke-width="2"/>
<text x="1200" y="271" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#000000">
<tspan x="1200" dy="0">2. Enforce resource boundaries</tspan>
</text>
<rect x="1220" y="315" width="250" height="145" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="1345.0" y="355.1" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1345.0" dy="0">APIM data gateway</tspan>
<tspan x="1345.0" dy="21.6">validate caller / OBO</tspan>
<tspan x="1345.0" dy="21.6">log path + oid</tspan>
<tspan x="1345.0" dy="21.6">body logging off</tspan>
</text>
<rect x="1530" y="280" width="290" height="105" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="1675.0" y="321.7" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1675.0" dy="0">Boundary A</tspan>
<tspan x="1675.0" dy="21.6">Search service A + KB A</tspan>
</text>
<rect x="1530" y="415" width="290" height="105" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text x="1675.0" y="456.7" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1675.0" dy="0">Boundary B</tspan>
<tspan x="1675.0" dy="21.6">Search service B + KB B</tspan>
</text>
<rect x="1530" y="550" width="290" height="105" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="1675.0" y="591.7" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1675.0" dy="0">Boundary C</tspan>
<tspan x="1675.0" dy="21.6">Search service C + KB C</tspan>
</text>
<path d="M1090,380 L1220,380" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="1155.0" y="364.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="1155.0" dy="0">agent / user token</tspan>
</text>
<path d="M1470,350 L1530,332" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="1500.0" y="325.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="1500.0" dy="0">RBAC</tspan>
</text>
<path d="M1470,375 L1530,467" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="1500.0" y="405.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="1500.0" dy="0">RBAC</tspan>
</text>
<path d="M1470,400 L1530,602" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="1500.0" y="485.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="1500.0" dy="0">RBAC</tspan>
</text>
<rect x="1210" y="525" width="280" height="120" rx="10" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
<text x="1350.0" y="574.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1350.0" dy="0">Do not use one multi-index KB</tspan>
<tspan x="1350.0" dy="21.6">as the only strict authorization boundary.</tspan>
</text>
<text x="1210" y="690" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#000000">
<tspan x="1210" dy="0">Recommended target: Private Link / existing VNet</tspan>
<tspan x="1210" dy="20.25">and deny-by-default public access where supported.</tspan>
</text>
<rect x="30" y="770" width="1120" height="420" rx="14" fill="none" stroke="#107C10" stroke-width="2"/>
<text x="50" y="806" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#000000">
<tspan x="50" dy="0">3. Model authorization plane</tspan>
</text>
<rect x="70" y="875" width="210" height="120" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="175.0" y="935.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="175.0" dy="0">Prompt agent</tspan>
</text>
<rect x="330" y="855" width="250" height="160" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text x="455.0" y="902.6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="455.0" dy="0">Admin-connected model</tspan>
<tspan x="455.0" dy="21.6">ModelGateway / ApiManagement</tspan>
<tspan x="455.0" dy="21.6">exact model alias</tspan>
<tspan x="455.0" dy="21.6">credential in connection</tspan>
</text>
<rect x="640" y="855" width="250" height="160" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="765.0" y="913.4" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="765.0" dy="0">Dedicated AI Gateway</tspan>
<tspan x="765.0" dy="21.6">one per trust boundary</tspan>
<tspan x="765.0" dy="21.6">runtime key scope = gateway</tspan>
</text>
<rect x="950" y="875" width="160" height="120" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="1030.0" y="924.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1030.0" dy="0">Foundry model</tspan>
<tspan x="1030.0" dy="21.6">backend</tspan>
</text>
<path d="M280,935 L330,935" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="305.0" y="919.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="305.0" dy="0">model reference</tspan>
</text>
<path d="M580,935 L640,935" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="610.0" y="919.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="610.0" dy="0">API key</tspan>
</text>
<path d="M890,935 L950,935" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#secure-arrow)"/>
<text x="920.0" y="919.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="920.0" dy="0">gateway MI</tspan>
<tspan x="920.0" dy="18.900000000000002">Foundry User</tspan>
</text>
<rect x="330" y="1050" width="560" height="92" rx="10" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
<text x="610.0" y="1084.525" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#000000">
<tspan x="610.0" dy="0">A runtime key reaches every published asset in one gateway.</tspan>
<tspan x="610.0" dy="22.950000000000003">Use separate gateways for authorization isolation.</tspan>
</text>
<rect x="1180" y="770" width="690" height="420" rx="14" fill="none" stroke="#0C8599" stroke-width="2"/>
<text x="1200" y="806" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#000000">
<tspan x="1200" dy="0">4. Correlated, content-minimized observability</tspan>
</text>
<rect x="1210" y="855" width="190" height="165" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="1305.0" y="905.1" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1305.0" dy="0">Project App Insights</tspan>
<tspan x="1305.0" dy="21.6">user oid / agent id</tspan>
<tspan x="1305.0" dy="21.6">correlation ID</tspan>
<tspan x="1305.0" dy="21.6">no answer content</tspan>
</text>
<rect x="1430" y="855" width="190" height="165" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="1525.0" y="915.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1525.0" dy="0">APIM App Insights</tspan>
<tspan x="1525.0" dy="21.6">route / status / caller</tspan>
<tspan x="1525.0" dy="21.6">body logging off</tspan>
</text>
<rect x="1650" y="855" width="190" height="165" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="1745.0" y="905.1" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1745.0" dy="0">Gateway App Insights</tspan>
<tspan x="1745.0" dy="21.6">token metrics</tspan>
<tspan x="1745.0" dy="21.6">key identity</tspan>
<tspan x="1745.0" dy="21.6">not user oid</tspan>
</text>
<path d="M1400,938 L1430,938" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#secure-arrow)"/>
<text x="1415.0" y="922.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="1415.0" dy="0">correlation ID</tspan>
</text>
<path d="M1620,938 L1650,938" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#secure-arrow)"/>
<text x="1635.0" y="922.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#000000">
<tspan x="1635.0" dy="0">correlation ID</tspan>
</text>
<rect x="1210" y="1050" width="630" height="92" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text x="1525.0" y="1085.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="1525.0" dy="0">Telemetry is evidence, not authorization. store:false and content filtering reduce export;</tspan>
<tspan x="1525.0" dy="21.6">they are not a zero-provider-retention guarantee.</tspan>
</text>
<text x="40" y="1251" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#000000">
<tspan x="40" dy="0">Live-verified: project / agent / user IQ identities, deny paths and dedicated-gateway BYOM. Recommended target: private networking and separate deployments per trust boundary.</tspan>
</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">C custom: Toolbox OAuth authorization code and refresh flow</title>
  <desc id="desc">The user approves delegated API access in Entra. The authorization code returns to Toolbox's exact Web callback registered on a separate confidential OAuth client. Toolbox exchanges the code or refreshes the token. The hosted agent calls Toolbox, which sends the delegated API-audience token to HTTPS FastMCP. The API validates signature, issuer, tenant, audience, timing and access_as_user before running probe_echo. This is not demonstrated JWT-bearer OBO.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245a81"/></marker></defs>
  <rect width="1100" height="430" fill="#f5f7fb"/>
  <g fill="#fff" stroke="#245a81" stroke-width="2">
    <rect x="20" y="75" width="240" height="90" rx="10"/>
    <rect x="335" y="75" width="320" height="90" rx="10"/>
    <rect x="760" y="75" width="320" height="90" rx="10"/>
    <rect x="20" y="245" width="240" height="95" rx="10"/>
    <rect x="335" y="245" width="320" height="95" rx="10"/>
    <rect x="760" y="245" width="320" height="95" rx="10"/>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="2" marker-end="url(#arrow)">
    <path d="M260 120H333"/><path d="M655 120H758"/><path d="M920 165V210H495V243"/>
    <path d="M260 292H333"/><path d="M655 292H758"/>
  </g>
  <g font-family="Segoe UI, sans-serif" fill="#142e45" text-anchor="middle">
    <text x="550" y="32" font-size="23">C custom — Delegated OAuth for your own API</text>
    <text x="140" y="106" font-size="18">1. User browser</text>
    <text x="140" y="137" font-size="14">Connection authorization</text>
    <text x="495" y="103" font-size="18">2. Entra authorization</text>
    <text x="495" y="132" font-size="14">API app exposes access_as_user</text><text x="495" y="152" font-size="14">Client has delegated permission</text>
    <text x="920" y="103" font-size="18">3. Exact Web callback</text>
    <text x="920" y="132" font-size="14">Registered on OAuth client app</text><text x="920" y="152" font-size="14">Code delivered to Toolbox</text>
    <text x="720" y="202" font-size="14">Confidential client: code exchange / refresh</text>
    <text x="140" y="278" font-size="18">4. Hosted agent</text>
    <text x="140" y="307" font-size="14">FoundryToolbox call</text><text x="140" y="327" font-size="14">No manual OAuth/OBO</text>
    <text x="495" y="278" font-size="18">5. Toolbox OAuth connection</text>
    <text x="495" y="307" font-size="14">Entra authorize + token endpoints</text><text x="495" y="327" font-size="14">API scope + offline_access</text>
    <text x="920" y="278" font-size="18">6. HTTPS FastMCP /mcp</text>
    <text x="920" y="307" font-size="14">Validate JWT + delegated scope</text><text x="920" y="327" font-size="14">Then execute probe_echo</text>
    <text x="550" y="378" font-size="16">Two Entra apps; user/admin consent per tenant policy. API v2 audience is normally its client ID GUID.</text>
    <text x="550" y="408" font-size="16">Authorization code + refresh, not proven JWT-bearer OBO. /healthz proves readiness only.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">B: calling agent instance identity retrieval flow</title>
  <desc id="desc">Toolbox AgenticIdentityToken forks to native Search KB MCP with agent Search RBAC or custom FastMCP with JWT and agent principal authorization. The optional isolated hosted agent to APIM to Toolbox to MCP route preserves original direct traffic. Missing agent-instance context is a blocked result, not a reason for manual token exchange or project fallback.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245a81"/></marker></defs>
  <rect width="1100" height="510" fill="#f5f7fb"/>
  <g fill="#fff" stroke="#245a81" stroke-width="2">
    <rect x="20" y="100" width="170" height="100" rx="10"/>
    <rect x="250" y="100" width="210" height="100" rx="10"/>
    <rect x="520" y="100" width="240" height="100" rx="10"/>
    <rect x="830" y="100" width="250" height="100" rx="10"/>
    <rect x="830" y="225" width="250" height="85" rx="10"/>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="2" marker-end="url(#arrow)">
    <path d="M190 150H248"/><path d="M460 150H518"/><path d="M760 150H828"/><path d="M790 150V265H828"/>
  </g>
  <g font-family="Segoe UI, sans-serif" fill="#142e45" text-anchor="middle">
    <text x="550" y="35" font-size="23">B — Separate data access for each calling agent</text>
    <text x="105" y="133" font-size="18">1. Invoking user</text>
    <text x="105" y="162" font-size="14">Caller token:</text><text x="105" y="182" font-size="14">ai.azure.com</text>
    <text x="355" y="133" font-size="18">2. Hosted instance</text>
    <text x="355" y="163" font-size="14">Platform agent identity</text><text x="355" y="183" font-size="14">Hosted calling context</text>
    <text x="640" y="133" font-size="18">3. Toolbox connection</text>
    <text x="640" y="163" font-size="14">AgenticIdentityToken</text><text x="640" y="183" font-size="14">Target-specific audience</text>
    <text x="955" y="133" font-size="18">4. Trusted Search KB</text>
    <text x="955" y="163" font-size="14">Calling instance object ID</text><text x="955" y="183" font-size="14">Search Index Data Reader</text>
    <text x="955" y="249" font-size="18">OR custom FastMCP</text>
    <text x="955" y="272" font-size="13">JWT + explicit agent principals</text>
    <text x="955" y="293" font-size="13">Role / allowlist; no project fallback</text>
    <text x="430" y="255" font-size="15">Platform agent identity, not OAuth client</text>
    <text x="430" y="282" font-size="15">Custom audience + oid mapping: experimental</text>
    <text x="550" y="350" font-size="16">Native Search retained. Custom token acquisition must be observed live.</text>
    <text x="550" y="380" font-size="16">Negative control: same caller, different unauthorized agent principal.</text>
    <text x="550" y="407" font-size="14">No agent/APIM token exchange; C delegated OAuth remains separate.</text>
  </g>
  <rect x="80" y="430" width="940" height="60" rx="10" fill="#fff" stroke="#245a81" stroke-dasharray="6 4"/>
  <text x="550" y="455" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17">OPTIONAL isolated observability: Hosted agent → APIM → Toolbox → native KB / custom FastMCP</text>
  <text x="550" y="477" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14">No project/user fallback. Caller-context presence/hash is evidence, not proof of agent identity resolution.</text>
</svg>

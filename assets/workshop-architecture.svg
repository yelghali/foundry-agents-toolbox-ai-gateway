<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">Foundry hosted agent and Toolbox identity boundaries</title>
  <desc id="desc">Toolbox forks to native Azure Search MCP for project, agent or user RBAC and to custom FastMCP for project or agent application tokens or separate C delegated OAuth. Custom A/B audience and principal claims require live verification. APIM does not exchange these tokens.</desc>
  <rect width="1100" height="400" fill="#f5f7fb"/>
  <g fill="#ffffff" stroke="#245a81" stroke-width="2">
    <rect x="20" y="150" width="155" height="80" rx="10"/>
    <rect x="230" y="150" width="180" height="80" rx="10"/>
    <rect x="465" y="150" width="220" height="80" rx="10"/>
    <rect x="780" y="100" width="290" height="80" rx="10"/>
    <rect x="780" y="250" width="290" height="80" rx="10"/>
    <rect x="230" y="20" width="180" height="70" rx="10"/>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="3">
    <path d="M175 190H230 M410 190H465 M685 190H730V140H780 M730 190V290H780 M320 150V90"/>
  </g>
  <g font-family="Segoe UI, sans-serif" fill="#142e45" text-anchor="middle" font-size="18">
    <text x="97" y="185">Invoking user</text><text x="97" y="210" font-size="14">Entra / ai.azure.com</text>
    <text x="320" y="185">Hosted agent</text><text x="320" y="210" font-size="14">ResponsesHostServer</text>
    <text x="575" y="185">Foundry Toolbox</text><text x="575" y="210" font-size="14">Connection authentication</text>
    <text x="925" y="130">Trusted Search KB</text><text x="925" y="155" font-size="14">A project / B agent / C user + RBAC</text>
    <text x="925" y="274">Custom FastMCP API</text>
    <text x="925" y="296" font-size="12">A project / B agent: JWT + role or allowlist</text>
    <text x="925" y="316" font-size="12">C separate delegated OAuth: JWT + scope</text>
    <text x="320" y="50">Model deployment</text><text x="320" y="75" font-size="14">Separate model access</text>
    <text x="560" y="365" font-size="16">Optional APIM: ingress or data gateway. Telemetry records evidence; it does not grant access.</text>
    <text x="560" y="388" font-size="14">A/B custom audience acquisition is not proven by local tests or connection creation alone.</text>
  </g>
</svg>

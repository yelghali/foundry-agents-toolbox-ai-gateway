<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
  <title id="title">A: project managed identity retrieval flow</title>
  <desc id="desc">Toolbox selects ProjectManagedIdentity and forks to native Search KB MCP with Search RBAC or a custom FastMCP API with JWT validation and project principal authorization. An optional isolated hosted agent to APIM to Toolbox to MCP observability route preserves the original direct route; APIM does not exchange tokens.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245a81"/></marker></defs>
  <rect width="1100" height="490" fill="#f5f7fb"/>
  <g fill="#fff" stroke="#245a81" stroke-width="2">
    <rect x="20" y="100" width="170" height="100" rx="10"/>
    <rect x="250" y="100" width="200" height="100" rx="10"/>
    <rect x="510" y="100" width="250" height="100" rx="10"/>
    <rect x="830" y="100" width="250" height="100" rx="10"/>
    <rect x="830" y="225" width="250" height="85" rx="10"/>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="2" marker-end="url(#arrow)">
    <path d="M190 150H248"/><path d="M450 150H508"/><path d="M760 150H828"/><path d="M790 150V265H828"/>
  </g>
  <g font-family="Segoe UI, sans-serif" fill="#142e45" text-anchor="middle">
    <text x="550" y="35" font-size="23">A — Shared project data access</text>
    <text x="105" y="133" font-size="18">1. Invoking user</text>
    <text x="105" y="162" font-size="14">Caller token:</text><text x="105" y="182" font-size="14">ai.azure.com</text>
    <text x="350" y="133" font-size="18">2. Hosted agent</text>
    <text x="350" y="163" font-size="14">FoundryToolbox</text><text x="350" y="183" font-size="14">Model access is separate</text>
    <text x="635" y="133" font-size="18">3. Toolbox connection</text>
    <text x="635" y="163" font-size="14">ProjectManagedIdentity</text><text x="635" y="183" font-size="14">Target-specific audience</text>
    <text x="955" y="133" font-size="18">4. Trusted Search KB</text>
    <text x="955" y="163" font-size="14">Project MI object ID</text><text x="955" y="183" font-size="14">Search Index Data Reader</text>
    <text x="955" y="249" font-size="18">OR custom FastMCP</text>
    <text x="955" y="272" font-size="13">JWT + expected project principal</text>
    <text x="955" y="293" font-size="13">Application role / explicit allowlist</text>
    <text x="430" y="255" font-size="15">Custom: separate registered API and server</text>
    <text x="430" y="282" font-size="15">Toolbox acquires token; no manual exchange</text>
    <text x="550" y="348" font-size="16">Native Search retained. Custom audience/claims require live evidence.</text>
    <text x="550" y="377" font-size="16">C's delegated-only OAuth server is separate and unchanged.</text>
  </g>
  <rect x="80" y="410" width="940" height="60" rx="10" fill="#fff" stroke="#245a81" stroke-dasharray="6 4"/>
  <text x="550" y="435" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17">OPTIONAL isolated observability: Hosted agent → APIM → Toolbox → native KB / custom FastMCP</text>
  <text x="550" y="457" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14">APIM preserves platform token + trusted caller context. Original direct route above remains unchanged.</text>
</svg>
